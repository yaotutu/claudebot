name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below to help us diagnose the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what went wrong.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Configure claudebot with ...
        2. Send message ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: |
        Paste any relevant log output. You can run claudebot with `--log-level DEBUG` for more verbose logs.
        **Remember to redact any sensitive information (tokens, API keys, passwords, etc.)**
      render: shell

  - type: input
    id: version
    attributes:
      label: claudebot Version
      description: Run `claudebot --version` or `pip show claudebot`
      placeholder: e.g., 0.2.0
    validations:
      required: true

  - type: dropdown
    id: python_version
    attributes:
      label: Python Version
      description: What Python version are you using?
      options:
        - "3.11"
        - "3.12"
        - "3.13"
        - Other (specify below)
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
        - Docker
        - Other (specify below)
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Surface
      description: Where did you see the issue?
      options:
        - WebUI
        - CLI agent
        - Gateway / WebSocket
        - Configuration
        - MCP / Skills
        - Memory / Schedules
        - Other (specify below)
    validations:
      required: true

  - type: dropdown
    id: claude_code_endpoint
    attributes:
      label: Claude Code Endpoint
      description: Which Claude Code compatible endpoint are you using?
      options:
        - Anthropic official API
        - Third-party Anthropic-compatible endpoint
        - Local Claude Code compatible endpoint
        - Not sure
        - Other (specify below)
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Configuration (Optional)
      description: |
        Relevant parts of your claudebot configuration. **Remember to redact any sensitive information.**
      render: yaml

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or information that might help.
